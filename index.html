<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BirdBox</title>
  <meta name="description" content="BirdBox — pedigree registry and aviary management for bird breeders.">
  <meta name="theme-color" content="#C1694F">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app/icon-192.png">
  <link rel="apple-touch-icon" href="icons/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BirdBox">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="app-bar">
      <button id="back-btn" class="icon-btn" hidden aria-label="Back">&#8592;</button>
      <h1 id="app-title">BirdBox</h1>
      <div id="app-bar-spacer"></div>
      <button id="avatar-btn" aria-label="Account">
        <img src="icons/tinted/account/My_Profile.png" alt="">
      </button>
    </header>

    <nav id="tab-bar" hidden></nav>

    <main id="main-content"></main>
  </div>

  <script src="js/nav-data.js"></script>
  <script src="js/data/birds-sample.js"></script>
  <script src="js/screens/birds.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
